name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: password
                    MYSQL_DATABASE: taskflow_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

            redis:
                image: redis:7
                ports:
                    - 6379:6379

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  cd backend
                  pip install -r requirements.txt

            - name: Run tests
              run: |
                  cd backend
                  pytest tests/ -v
              env:
                  DATABASE_URL: mysql+aiomysql://root:password@localhost:3306/taskflow_test
                  REDIS_URL: redis://localhost:6379
                  SECRET_KEY: test-secret-key
